# Basic ESPHome configuration including the device name.
esphome:
  name: stove-sensor

# Specifies the hardware platform and framework.
# ESP-IDF is preferred for camera stability and performance.
esp32:
  board: esp32cam
  framework:
    type: esp-idf

# Network configuration for Home Assistant connectivity and the
# snapshot preview server.
wifi:
  fast_connect: true # Optional. Required if connecting to a hidden SSID
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      hidden: true

# Enables external RAM, which is required by the ESP32-CAM to handle
# image buffers for the camera and web server.
psram:

# Detailed pinout and settings for the ESP32-CAM hardware.
esp32_camera:
  id: my_camera
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_pins:
    sda: GPIO26
    scl: GPIO27
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  resolution: 1024x768
  jpeg_quality: 10
  vertical_flip: false
  horizontal_mirror: false
  frame_buffer_count: 2
  idle_framerate: 1fps

# Points ESPHome to the local directory containing the custom
# camera_light_sensor component code.
external_components:
  - source:
      type: local
      path: .

camera_light_sensor:
  # The ID for this hub, to be referenced by the binary sensors.
  id: camera_hub
  # Do not provide a 'name' here; this hub is a internal coordinator.
  # Optional: If provided, starts a web server on this port.
  # Visiting http://<device_ip>:<port>/ serves a snapshot for ROI alignment.
  port: 8080
  # Optional: Heartbeat interval for all sensors. State changes are
  # pushed immediately (twice per second) regardless of this.
  update_interval: 10s
  # Optional: The interval between camera captures. If set, the ESP32
  # enters Light Sleep between captures to save power. Recommended for >1s.

binary_sensor:
  - platform: camera_light_sensor
    # The ID of the hub configured above.
    camera_light_sensor_id: camera_hub
    # A list of regions to monitor.
    sensor_roi:
      - name: "Stove On"
        # The Region of Interest coordinates [x1, y1, x2, y2].
        box: [927, 292, 931, 296]
        # The target color in RGB [R, G, B].
        expected_color: [255, 0, 0]  # Red
      - name: "Surface Hot"
        box: [300, 300, 304, 304]
        expected_color: [255, 0, 0]  # Red
      - name: "Surface Warm"
        box: [820, 477, 824, 481]
        expected_color: [236, 236, 236]  # White/Gray

# Enables logging over Serial/USB for debugging and monitoring
# the image processing performance.
logger:
  level: VERY_VERBOSE
