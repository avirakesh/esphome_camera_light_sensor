esphome:
  name: stove-sensor

esp32:
  board: esp32cam
  framework:
    type: esp-idf

psram:

wifi:
  fast_connect: true # Optional. Required if connecting to a hidden SSID
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      hidden: true

# Point to the local folder instead of Git
external_components:
  - source:
      type: local
      path: .

esp32_camera:
  id: my_camera
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_pins:
    sda: GPIO26
    scl: GPIO27
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  resolution: 1024x768
  jpeg_quality: 10
  vertical_flip: false
  horizontal_mirror: false
  frame_buffer_count: 2

camera_light_sensor:
  id: camera_hub
  port: 8080
  update_interval: 10s

binary_sensor:
  - platform: camera_light_sensor
    camera_light_sensor_id: camera_hub
    sensor_roi:
      - name: "Stove On"
        box: [927, 292, 930, 295]
        expected_color: [255, 0, 0]  # Red
      - name: "Surface Hot"
        box: [300, 300, 400, 400]
        expected_color: [255, 0, 0]  # Red

# Standard logging to see your ESP-IDF traces
logger:
  level: VERY_VERBOSE
